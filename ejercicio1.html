<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 1</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Generador de matrices (números diagonales)</h1>
    <input type="number" placeholder="filas" id="filas" />
    <input type="number" placeholder="columnas" id="columnas" /><br>
    <button onclick="generarMatriz()">Generar matriz</button>
    <p id="resultado"></p>

    <script>
        function generarMatriz() {
            let filas = document.getElementById("filas").value;
            let columnas = document.getElementById("columnas").value;
            let resultados = document.getElementById("resultado");
            let matriz = [];
            for (let i = 0; i < filas; i++) {
                let fila_generada = [];
                for (let j = 0; j < columnas; j++) {
                    if (i == j) {
                        fila_generada[j] = i + 1;
                    } else {
                        fila_generada[j] = "-";
                    }
                }
                matriz[i] = fila_generada;
            }

            // console.log(matriz);


            // 2. Representarla en HTML
            const tabla = document.createElement("table");
            for (let i = 0; i < matriz.length; i++) {
                const tr = document.createElement("tr");
                for (let j = 0; j < matriz[i].length; j++) {
                    const td = document.createElement("td");
                    td.textContent = matriz[i][j];
                    tr.appendChild(td);
                }
                tabla.appendChild(tr);
            }
            resultado.appendChild(tabla);
        }
    </script>
</body>
</html>
